      "description": "Run Codex for a personal or project workspace and complete a modify/test/commit/push workflow.",
      "class": "P1",
      "owner": "agent-runtime",
      "justification": "This is the first user-facing walking-skeleton agent journey.",
      "oracle": "A disposable authorized repository is modified, tested, committed, pushed, and audited with a correlated run id.",
      "corpus": "visible:v2-walking-skeleton-v0/codex-repo-change",

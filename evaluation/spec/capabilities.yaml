    },
    {
      "capability_id": "workspace_isolation",
      "description": "Separate personal and project contexts, including negative checks for file and data leakage.",
      "class": "P0",
      "owner": "control-plane",
      "justification": "Project/user data separation is a non-negotiable security and integrity gate.",
      "oracle": "A run in one context cannot read or mutate files, secrets, sessions, or RAG data from another context.",
      "corpus": "visible:v2-walking-skeleton-v0/context-isolation",
      "metrics": ["tpsr", "isolation_violations"],
      "dependencies": ["bootstrap_doctor"],
      "retirement_rule": "No retirement; isolation remains a permanent P0 regression gate."
    },
    {
      "capability_id": "model_broker_basic",
      "description": "Broker model calls through the approved internal route with explicit backend health, fallback, usage, and errors.",
      "class": "P0",
      "owner": "model-broker",
      "justification": "Agents must not reach model backends directly and failures must be recoverable.",
      "oracle": "A model backend failure is detected, direct backend access is refused, fallback is explicit, and usage is recorded.",

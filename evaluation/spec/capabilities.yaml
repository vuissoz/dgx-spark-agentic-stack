      "class": "P0",
      "owner": "operations",
      "justification": "Recovery and deterministic rollback are required before any v2 promotion.",
      "oracle": "The release, data, runtime resources, and doctor evidence match the selected healthy checkpoint after restore.",
      "corpus": "visible:v2-walking-skeleton-v0/snapshot-restore-rollback",
      "metrics": ["tpsr", "rollback_seconds", "restore_seconds", "unresolved_resources"],
      "dependencies": ["bootstrap_doctor"],
      "retirement_rule": "No retirement; recovery remains a permanent P0 gate."

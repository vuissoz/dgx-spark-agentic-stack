{
  "schema_version": "v2-retention.v0",
  "source": "PLAN.md section 15.4.9",
  "default_policy": {
    "local_only": true,
    "external_telemetry_default": "disabled",
    "secret_redaction_required": true
  },
  "artifact_classes": [
    {
      "class_id": "durable-summary",
      "examples": ["evaluation.json", "manifest.json", "gates.json", "report.md"],
      "retain_until": "release and related incidents are closed"
    },
    {
      "class_id": "diagnostic-log",
      "examples": ["logs", "traces", "attempts"],
      "retain_until": "retention quota or incident closure, whichever is later"
    },
    {
      "class_id": "sensitive-working-data",
      "examples": ["prompts", "model outputs", "workspace diffs"],
      "retain_until": "shortest policy compatible with active debugging and rollback evidence"
    }
  ],
  "cleanup_requires": ["dry_run", "manifest", "no active release dependency", "no unresolved incident dependency"]
}

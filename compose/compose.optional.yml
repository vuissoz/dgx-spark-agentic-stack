services:
  optional-sentinel:
    image: alpine:3.20
    profiles:
      - optional
    user: "${AGENT_RUNTIME_UID:-1000}:${AGENT_RUNTIME_GID:-1000}"
    command:
      - /bin/sh
      - -lc
      - sleep infinity
    restart: unless-stopped
    cpus: ${AGENTIC_LIMIT_OPTIONAL_SENTINEL_CPUS:-${AGENTIC_LIMIT_OPTIONAL_CPUS:-${AGENTIC_LIMIT_DEFAULT_CPUS:-1.00}}}
    mem_limit: ${AGENTIC_LIMIT_OPTIONAL_SENTINEL_MEM:-${AGENTIC_LIMIT_OPTIONAL_MEM:-${AGENTIC_LIMIT_DEFAULT_MEM:-1g}}}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - test -r /etc/alpine-release
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - agentic

  optional-mcp-catalog:
    image: agentic/optional-modules:local
    build:
      context: ..
      dockerfile: deployments/optional/Dockerfile
      args:
        OPENCLAW_INSTALL_CLI_SCRIPT: ${AGENTIC_OPENCLAW_INSTALL_CLI_SCRIPT:-https://openclaw.ai/install-cli.sh}
        OPENCLAW_INSTALL_VERSION: ${AGENTIC_OPENCLAW_INSTALL_VERSION:-latest}
    profiles:
      - optional-mcp
    command:
      - mcp
    restart: unless-stopped
    cpus: ${AGENTIC_LIMIT_OPTIONAL_MCP_CATALOG_CPUS:-${AGENTIC_LIMIT_OPTIONAL_CPUS:-${AGENTIC_LIMIT_DEFAULT_CPUS:-1.00}}}
    mem_limit: ${AGENTIC_LIMIT_OPTIONAL_MCP_CATALOG_MEM:-${AGENTIC_LIMIT_OPTIONAL_MEM:-${AGENTIC_LIMIT_DEFAULT_MEM:-1g}}}
    user: "${AGENT_RUNTIME_UID:-1000}:${AGENT_RUNTIME_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      OPTIONAL_BIND_HOST: 0.0.0.0
      OPTIONAL_BIND_PORT: 8122
      AUDIT_LOG_PATH: /logs/audit.jsonl
      MCP_AUTH_TOKEN_FILE: /run/secrets/mcp.token
      MCP_ALLOWLIST_FILE: /config/tool_allowlist.txt
      HTTP_PROXY: http://egress-proxy:3128
      HTTPS_PROXY: http://egress-proxy:3128
      NO_PROXY: ollama-gate,unbound,egress-proxy,localhost,127.0.0.1
    volumes:
      - ${AGENTIC_ROOT:-/srv/agentic}/optional/mcp/config:/config:ro
      - ${AGENTIC_ROOT:-/srv/agentic}/optional/mcp/state:/state
      - ${AGENTIC_ROOT:-/srv/agentic}/optional/mcp/logs:/logs
      - ${AGENTIC_ROOT:-/srv/agentic}/secrets/runtime/mcp.token:/run/secrets/mcp.token:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >
          python3 -c 'import sys,urllib.request;
          sys.exit(0 if urllib.request.urlopen("http://127.0.0.1:8122/healthz", timeout=3).status == 200 else 1)'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - agentic

  optional-pi-mono:
    image: agentic/agent-cli-base:local
    build:
      context: ..
      dockerfile: deployments/images/agent-cli-base/Dockerfile
      args:
        AGENT_CLI_INSTALL_MODE: ${AGENTIC_AGENT_CLI_INSTALL_MODE:-best-effort}
        CODEX_CLI_NPM_SPEC: ${AGENTIC_CODEX_CLI_NPM_SPEC:-@openai/codex@latest}
        CLAUDE_CODE_NPM_SPEC: ${AGENTIC_CLAUDE_CODE_NPM_SPEC:-@anthropic-ai/claude-code@latest}
        OPENCODE_NPM_SPEC: ${AGENTIC_OPENCODE_NPM_SPEC:-opencode-ai@latest}
        PI_CODING_AGENT_NPM_SPEC: ${AGENTIC_PI_CODING_AGENT_NPM_SPEC:-@mariozechner/pi-coding-agent@latest}
        OPENHANDS_INSTALL_SCRIPT: ${AGENTIC_OPENHANDS_INSTALL_SCRIPT:-https://install.openhands.dev/install.sh}
        OPENCLAW_INSTALL_CLI_SCRIPT: ${AGENTIC_OPENCLAW_INSTALL_CLI_SCRIPT:-https://openclaw.ai/install-cli.sh}
        OPENCLAW_INSTALL_VERSION: ${AGENTIC_OPENCLAW_INSTALL_VERSION:-latest}
        VIBE_INSTALL_SCRIPT: ${AGENTIC_VIBE_INSTALL_SCRIPT:-https://mistral.ai/vibe/install.sh}
    profiles:
      - optional-pi-mono
    restart: unless-stopped
    cpus: ${AGENTIC_LIMIT_OPTIONAL_PI_MONO_CPUS:-${AGENTIC_LIMIT_OPTIONAL_CPUS:-${AGENTIC_LIMIT_DEFAULT_CPUS:-1.00}}}
    mem_limit: ${AGENTIC_LIMIT_OPTIONAL_PI_MONO_MEM:-${AGENTIC_LIMIT_OPTIONAL_MEM:-${AGENTIC_LIMIT_DEFAULT_MEM:-1g}}}
    init: true
    user: "${AGENT_RUNTIME_UID:-1000}:${AGENT_RUNTIME_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      AGENT_TOOL: pi-mono
      AGENT_PRIMARY_CLI: pi
      AGENT_SESSION: pi-mono
      AGENT_HOME: /state/home
      AGENT_WORKSPACE: /workspace
      AGENT_STATE_DIR: /state
      AGENT_LOGS_DIR: /logs
      HOME: /state/home
      XDG_CONFIG_HOME: /state/home/.config
      XDG_CACHE_HOME: /state/home/.cache
      OLLAMA_BASE_URL: http://ollama-gate:11435
      OPENAI_BASE_URL: http://ollama-gate:11435/v1
      OPENAI_API_BASE_URL: http://ollama-gate:11435/v1
      OPENAI_API_BASE: http://ollama-gate:11435/v1
      OPENAI_API_KEY: ollama
      ANTHROPIC_AUTH_TOKEN: ollama
      ANTHROPIC_API_KEY: ollama
      GATE_MCP_URL: http://gate-mcp:8123
      GATE_MCP_AUTH_TOKEN_FILE: /run/secrets/gate_mcp.token
      AGENTIC_DEFAULT_MODEL: ${AGENTIC_DEFAULT_MODEL:-qwen3-coder:30b}
      AGENTIC_DEFAULT_MODEL_CONTEXT_WINDOW: ${AGENTIC_DEFAULT_MODEL_CONTEXT_WINDOW:-50909}
      AGENTIC_AGENT_DEFAULT_MODEL: ${AGENTIC_AGENT_DEFAULT_MODEL:-${AGENTIC_DEFAULT_MODEL:-qwen3-coder:30b}}
      AGENTIC_AGENT_DEFAULT_MODEL_CONTEXT_WINDOW: ${AGENTIC_AGENT_DEFAULT_MODEL_CONTEXT_WINDOW:-${AGENTIC_DEFAULT_MODEL_CONTEXT_WINDOW:-50909}}
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-${AGENTIC_AGENT_DEFAULT_MODEL_CONTEXT_WINDOW:-${AGENTIC_DEFAULT_MODEL_CONTEXT_WINDOW:-50909}}}
      AGENTIC_CONTEXT_COMPACTION_SOFT_PERCENT: ${AGENTIC_CONTEXT_COMPACTION_SOFT_PERCENT:-75}
      AGENTIC_CONTEXT_COMPACTION_DANGER_PERCENT: ${AGENTIC_CONTEXT_COMPACTION_DANGER_PERCENT:-90}
      AGENTIC_CONTEXT_BUDGET_TOKENS: ${AGENTIC_CONTEXT_BUDGET_TOKENS:-50909}
      AGENTIC_CONTEXT_COMPACTION_SOFT_TOKENS: ${AGENTIC_CONTEXT_COMPACTION_SOFT_TOKENS:-38181}
      AGENTIC_CONTEXT_COMPACTION_DANGER_TOKENS: ${AGENTIC_CONTEXT_COMPACTION_DANGER_TOKENS:-45818}
      AGENTIC_GIT_FORGE_BASE_URL: http://optional-forgejo:3000
      AGENTIC_GIT_FORGE_SHARED_NAMESPACE: ${GIT_FORGE_SHARED_NAMESPACE:-agentic}
      HTTP_PROXY: http://egress-proxy:3128
      HTTPS_PROXY: http://egress-proxy:3128
      NO_PROXY: ollama-gate,gate-mcp,optional-forgejo,unbound,egress-proxy,localhost,127.0.0.1
    volumes:
      - ${AGENTIC_ROOT:-/srv/agentic}/optional/pi-mono/state:/state
      - ${AGENTIC_ROOT:-/srv/agentic}/optional/pi-mono/logs:/logs
      - ${AGENTIC_PI_MONO_WORKSPACES_DIR:-${AGENTIC_ROOT:-/srv/agentic}/optional/pi-mono/workspaces}:/workspace
      - ${AGENTIC_ROOT:-/srv/agentic}/shared-ro:/shared-ro:ro
      - ${AGENTIC_ROOT:-/srv/agentic}/shared-rw:/shared-rw
      - ${AGENTIC_ROOT:-/srv/agentic}/secrets/runtime/gate_mcp.token:/run/secrets/gate_mcp.token:ro
      - ${AGENTIC_ROOT:-/srv/agentic}/secrets/runtime/git-forge/pi-mono.password:/run/secrets/git-forge.password:ro
      - ${AGENTIC_ROOT:-/srv/agentic}/secrets/ssh/pi-mono:/state/home/.ssh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - tmux has-session -t pi-mono
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    networks:
      - agentic

  optional-goose:
    image: ${AGENTIC_GOOSE_IMAGE:-agentic/goose-cli:local}
    build:
      context: ..
      dockerfile: deployments/images/goose/Dockerfile
    profiles:
      - optional-goose
    init: true
    user: "${AGENT_RUNTIME_UID:-1000}:${AGENT_RUNTIME_GID:-1000}"
    working_dir: /workspace
    entrypoint:
      - /bin/sh
      - -lc
    command:
      - |
        set -eu
        mkdir -p \
          /workspace \
          /logs \
          /state/home/.config/goose \
          /state/home/.cache \
          /state/home/.local/share/goose/sessions \
          /state/home/.local/state/goose/logs
        if [ -f /state/config.yaml ] && [ ! -f /state/home/.config/goose/config.yaml ]; then
          cp -a /state/config.yaml /state/home/.config/goose/config.yaml
        fi
        sleep infinity
    restart: unless-stopped
    cpus: ${AGENTIC_LIMIT_OPTIONAL_GOOSE_CPUS:-${AGENTIC_LIMIT_OPTIONAL_CPUS:-${AGENTIC_LIMIT_DEFAULT_CPUS:-1.00}}}
    mem_limit: ${AGENTIC_LIMIT_OPTIONAL_GOOSE_MEM:-${AGENTIC_LIMIT_OPTIONAL_MEM:-${AGENTIC_LIMIT_DEFAULT_MEM:-1g}}}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      HOME: /state/home
      XDG_CONFIG_HOME: /state/home/.config
      XDG_CACHE_HOME: /state/home/.cache
      XDG_DATA_HOME: /state/home/.local/share
      XDG_STATE_HOME: /state/home/.local/state
      GOOSE_PROVIDER: ${AGENTIC_GOOSE_PROVIDER:-ollama}
      GOOSE_MODEL: ${AGENTIC_GOOSE_MODEL:-${AGENTIC_AGENT_DEFAULT_MODEL:-${AGENTIC_DEFAULT_MODEL:-qwen3-coder:30b}}}
      GOOSE_CONTEXT_LIMIT: ${AGENTIC_GOOSE_CONTEXT_LIMIT:-${AGENTIC_AGENT_DEFAULT_MODEL_CONTEXT_WINDOW:-${AGENTIC_DEFAULT_MODEL_CONTEXT_WINDOW:-262144}}}
      AGENTIC_CONTEXT_BUDGET_TOKENS: ${AGENTIC_CONTEXT_BUDGET_TOKENS:-50909}
      AGENTIC_CONTEXT_COMPACTION_SOFT_PERCENT: ${AGENTIC_CONTEXT_COMPACTION_SOFT_PERCENT:-75}
      AGENTIC_CONTEXT_COMPACTION_DANGER_PERCENT: ${AGENTIC_CONTEXT_COMPACTION_DANGER_PERCENT:-90}
      AGENTIC_CONTEXT_COMPACTION_SOFT_TOKENS: ${AGENTIC_CONTEXT_COMPACTION_SOFT_TOKENS:-38181}
      AGENTIC_CONTEXT_COMPACTION_DANGER_TOKENS: ${AGENTIC_CONTEXT_COMPACTION_DANGER_TOKENS:-45818}
      GOOSE_CONTEXT_COMPACTION_SOFT_TOKENS: ${AGENTIC_CONTEXT_COMPACTION_SOFT_TOKENS:-38181}
      GOOSE_CONTEXT_COMPACTION_DANGER_TOKENS: ${AGENTIC_CONTEXT_COMPACTION_DANGER_TOKENS:-45818}
      OLLAMA_HOST: http://ollama-gate:11435
      AGENTIC_GIT_FORGE_BASE_URL: http://optional-forgejo:3000
      AGENTIC_GIT_FORGE_SHARED_NAMESPACE: ${GIT_FORGE_SHARED_NAMESPACE:-agentic}
      HTTP_PROXY: http://egress-proxy:3128
      HTTPS_PROXY: http://egress-proxy:3128
      NO_PROXY: ollama-gate,optional-forgejo,unbound,egress-proxy,localhost,127.0.0.1
    volumes:
      - ${AGENTIC_ROOT:-/srv/agentic}/optional/goose/state:/state
      - ${AGENTIC_ROOT:-/srv/agentic}/optional/goose/logs:/logs
      - ${AGENTIC_GOOSE_WORKSPACES_DIR:-${AGENTIC_ROOT:-/srv/agentic}/optional/goose/workspaces}:/workspace
      - ${AGENTIC_ROOT:-/srv/agentic}/shared-ro:/shared-ro:ro
      - ${AGENTIC_ROOT:-/srv/agentic}/shared-rw:/shared-rw
      - ${AGENTIC_ROOT:-/srv/agentic}/secrets/runtime/git-forge/goose.password:/run/secrets/git-forge.password:ro
      - ${AGENTIC_ROOT:-/srv/agentic}/secrets/ssh/goose:/state/home/.ssh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - goose session list >/dev/null 2>&1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    networks:
      - agentic

  optional-portainer:
    image: portainer/portainer-ce:latest
    profiles:
      - optional-portainer
    command:
      - --http-enabled
      - --bind
      - ":9000"
    restart: unless-stopped
    cpus: ${AGENTIC_LIMIT_OPTIONAL_PORTAINER_CPUS:-${AGENTIC_LIMIT_OPTIONAL_CPUS:-${AGENTIC_LIMIT_DEFAULT_CPUS:-1.00}}}
    mem_limit: ${AGENTIC_LIMIT_OPTIONAL_PORTAINER_MEM:-${AGENTIC_LIMIT_OPTIONAL_MEM:-${AGENTIC_LIMIT_DEFAULT_MEM:-1g}}}
    user: "${AGENT_RUNTIME_UID:-1000}:${AGENT_RUNTIME_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - 127.0.0.1:${PORTAINER_HOST_PORT:-9001}:9000
    volumes:
      - ${AGENTIC_ROOT:-/srv/agentic}/optional/portainer/data:/data
      - ${AGENTIC_ROOT:-/srv/agentic}/optional/portainer/logs:/logs
    healthcheck:
      test:
        - CMD
        - /portainer
        - --version
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    networks:
      - agentic
      - agentic-egress

  optional-n8n-sandbox-tls:
    image: ${N8N_SANDBOX_API_IMAGE:-n8nio/n8n-sandbox-service-api:latest}
    profiles:
      - optional-n8n-ai
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        bootstrap-mtls.sh --out-dir /tls \
          --api-san optional-n8n-sandbox-api \
          --control-san-prefix optional-n8n-sandbox-runner &&
        chown -R sandbox-api:sandbox-api /tls/api
    environment:
      NUM_RUNNERS: "1"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${AGENTIC_ROOT:-/srv/agentic}/optional/n8n/sandbox/tls:/tls
    networks:
      - n8n-sandbox

  optional-n8n-sandbox-registry:
    image: registry:2.8.3
    profiles:
      - optional-n8n-ai
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${AGENTIC_ROOT:-/srv/agentic}/optional/n8n/sandbox/registry:/var/lib/registry
    healthcheck:
      test:
        - CMD
        - /bin/registry
        - --version
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - n8n-sandbox

  optional-n8n-sandbox-image-seed:
    image: quay.io/skopeo/stable:latest
    profiles:
      - optional-n8n-ai
    depends_on:
      optional-n8n-sandbox-registry:
        condition: service_started
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      HTTP_PROXY: http://egress-proxy:3128
      HTTPS_PROXY: http://egress-proxy:3128
      NO_PROXY: optional-n8n-sandbox-registry,localhost,127.0.0.1
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        attempts=0
        until skopeo list-tags --tls-verify=false docker://optional-n8n-sandbox-registry:5000 >/dev/null 2>&1; do
          attempts=$$((attempts + 1))
          [ "$$attempts" -lt 30 ] || {
            echo "internal sandbox registry did not become ready" >&2
            exit 1
          }
          sleep 1
        done
        exec skopeo copy --dest-tls-verify=false \
          "docker://${N8N_SANDBOX_IMAGE:-n8nio/n8n-sandbox-service-sandbox:latest}" \
          docker://optional-n8n-sandbox-registry:5000/n8n-sandbox:local
    networks:
      - n8n-sandbox
      - agentic-egress

  optional-n8n-sandbox-api:
    image: ${N8N_SANDBOX_API_IMAGE:-n8nio/n8n-sandbox-service-api:latest}
    profiles:
      - optional-n8n-ai
    depends_on:
      optional-n8n-sandbox-tls:
        condition: service_completed_successfully
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      SANDBOX_API_KEYS: ${N8N_SANDBOX_API_KEY:-}
      SANDBOX_API_RUNNER_REGISTRATION_TOKEN: ${N8N_SANDBOX_RUNNER_REGISTRATION_TOKEN:-}
      SANDBOX_API_RUNNER_API_KEY: ${N8N_SANDBOX_RUNNER_API_KEY:-}
      SANDBOX_API_DEFAULT_MAX_SANDBOXES: ${N8N_SANDBOX_MAX_SANDBOXES:-4}
      SANDBOX_API_GRPC_TLS_CERT_FILE: /tls/grpc-server.crt
      SANDBOX_API_GRPC_TLS_KEY_FILE: /tls/grpc-server.key
      SANDBOX_API_GRPC_TLS_CLIENT_CA_FILE: /tls/ca.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CA_FILE: /tls/ca.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CERT_FILE: /tls/control-grpc-api-client.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_KEY_FILE: /tls/control-grpc-api-client.key
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_SERVER_NAME: optional-n8n-sandbox-runner-1
    volumes:
      - ${AGENTIC_ROOT:-/srv/agentic}/optional/n8n/sandbox/tls/api:/tls:ro
      - ${AGENTIC_ROOT:-/srv/agentic}/optional/n8n/sandbox/api-data:/var/lib/n8n-sandbox-api
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://127.0.0.1:8080/healthz
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      n8n-sandbox:
        aliases:
          - optional-n8n-sandbox-api

  optional-n8n-sandbox-runner:
    image: ${N8N_SANDBOX_RUNNER_IMAGE:-n8nio/n8n-sandbox-service-runner-dind:latest}
    profiles:
      - optional-n8n-ai
    runtime: sysbox-runc
    depends_on:
      optional-n8n-sandbox-tls:
        condition: service_completed_successfully
      optional-n8n-sandbox-api:
        condition: service_healthy
      optional-n8n-sandbox-image-seed:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      SANDBOX_RUNNER_API_KEYS: ${N8N_SANDBOX_RUNNER_API_KEY:-}
      SANDBOX_RUNNER_REGISTRATION_TOKEN: ${N8N_SANDBOX_RUNNER_REGISTRATION_TOKEN:-}
      SANDBOX_RUNNER_DOCKER_SANDBOX_IMAGE: optional-n8n-sandbox-registry:5000/n8n-sandbox:local
      SANDBOX_RUNNER_DOCKER_INSECURE_REGISTRIES: optional-n8n-sandbox-registry:5000
      SANDBOX_RUNNER_API_GRPC_ADDR: optional-n8n-sandbox-api:9090
      SANDBOX_RUNNER_HTTP_BASE_URL: https://optional-n8n-sandbox-runner-1:8080
      SANDBOX_RUNNER_CONTROL_GRPC_LISTEN_ADDR: ":9091"
      SANDBOX_RUNNER_CONTROL_GRPC_ADVERTISE_ADDR: optional-n8n-sandbox-runner-1:9091
      SANDBOX_RUNNER_ID: runner-1
      SANDBOX_RUNNER_CAPACITY_TOTAL: ${N8N_SANDBOX_MAX_SANDBOXES:-4}
      SANDBOX_RUNNER_IDLE_TTL_SECONDS: ${N8N_SANDBOX_IDLE_TTL_SECONDS:-900}
      SANDBOX_RUNNER_INTER_SANDBOX_NETWORK_ENABLED: "false"
      SANDBOX_RUNNER_DEFAULT_MEMORY_MB: ${N8N_SANDBOX_MEMORY_MB:-1024}
      SANDBOX_RUNNER_DEFAULT_CPU_PERCENT: ${N8N_SANDBOX_CPU_PERCENT:-100}
      SANDBOX_RUNNER_DEFAULT_PIDS_MAX: ${N8N_SANDBOX_PIDS_MAX:-256}
      SANDBOX_RUNNER_REGISTRATION_GRPC_CA_FILE: /tls/ca.crt
      SANDBOX_RUNNER_REGISTRATION_GRPC_CERT_FILE: /tls/grpc-client.crt
      SANDBOX_RUNNER_REGISTRATION_GRPC_KEY_FILE: /tls/grpc-client.key
      SANDBOX_RUNNER_REGISTRATION_GRPC_SERVER_NAME: optional-n8n-sandbox-api
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_CERT_FILE: /tls/control-grpc-server.crt
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_KEY_FILE: /tls/control-grpc-server.key
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_CLIENT_CA_FILE: /tls/ca.crt
    volumes:
      - ${AGENTIC_ROOT:-/srv/agentic}/optional/n8n/sandbox/tls/runner:/tls:ro
      - ${AGENTIC_ROOT:-/srv/agentic}/optional/n8n/sandbox/runner-data:/var/sandboxes
      - ${AGENTIC_ROOT:-/srv/agentic}/optional/n8n/sandbox/docker-data:/var/lib/docker
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - --no-check-certificate
        - https://127.0.0.1:8080/readyz
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 30s
    networks:
      n8n-sandbox:
        aliases:
          - optional-n8n-sandbox-runner-1

  optional-n8n-searxng:
    image: ${N8N_SEARXNG_IMAGE:-searxng/searxng:latest}
    profiles:
      - optional-n8n-ai
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/searxng
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      SEARXNG_SECRET: ${N8N_SEARXNG_SECRET:-}
      HTTP_PROXY: http://egress-proxy:3128
      HTTPS_PROXY: http://egress-proxy:3128
      NO_PROXY: unbound,egress-proxy,localhost,127.0.0.1
    volumes:
      - ${AGENTIC_REPO_ROOT:-..}/examples/optional/n8n-searxng-settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O- http://127.0.0.1:8080/healthz >/dev/null
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - agentic
      - agentic-egress

  optional-n8n:
    image: n8nio/n8n:latest
    profiles:
      - optional-n8n
      - optional-n8n-ai
    restart: unless-stopped
    cpus: ${AGENTIC_LIMIT_OPTIONAL_N8N_CPUS:-${AGENTIC_LIMIT_OPTIONAL_CPUS:-${AGENTIC_LIMIT_DEFAULT_CPUS:-1.00}}}
    mem_limit: ${AGENTIC_LIMIT_OPTIONAL_N8N_MEM:-${AGENTIC_LIMIT_OPTIONAL_MEM:-${AGENTIC_LIMIT_DEFAULT_MEM:-1g}}}
    user: "${AGENT_RUNTIME_UID:-1000}:${AGENT_RUNTIME_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp
      - /home/node/.cache:mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      N8N_BASIC_AUTH_ACTIVE: "${N8N_BASIC_AUTH_ACTIVE:-true}"
      N8N_BASIC_AUTH_USER: "${N8N_BASIC_AUTH_USER:-admin}"
      N8N_BASIC_AUTH_PASSWORD: "${N8N_BASIC_AUTH_PASSWORD:-change-me}"
      N8N_HOST: 0.0.0.0
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      NODE_ENV: production
      N8N_LOG_LEVEL: "${N8N_LOG_LEVEL:-info}"
      N8N_LOG_OUTPUT: console
      N8N_TIMEZONE: "${N8N_TIMEZONE:-UTC}"
      N8N_ENABLE_INSTANT_WEBHOOK: "${N8N_ENABLE_INSTANT_WEBHOOK:-false}"
      N8N_MAX_MEMORY_USAGE: "${N8N_MAX_MEMORY_USAGE:-1024}"
      N8N_ENABLED_MODULES: "${N8N_ENABLED_MODULES:-instance-ai}"
      N8N_INSTANCE_AI_MODEL: "${N8N_INSTANCE_AI_MODEL:-${AGENTIC_N8N_AI_MODEL:-qwen3.8}}"
      N8N_INSTANCE_AI_MODEL_URL: "${N8N_INSTANCE_AI_MODEL_URL:-http://ollama-gate:11435/v1}"
      N8N_INSTANCE_AI_MODEL_API_KEY: "${N8N_INSTANCE_AI_MODEL_API_KEY:-local-ollama}"
      N8N_INSTANCE_AI_SANDBOX_ENABLED: "${N8N_INSTANCE_AI_SANDBOX_ENABLED:-false}"
      N8N_INSTANCE_AI_SANDBOX_PROVIDER: n8n-sandbox
      N8N_INSTANCE_AI_SANDBOX_API_URL: http://optional-n8n-sandbox-api:8080
      N8N_INSTANCE_AI_SANDBOX_API_KEY: "${N8N_SANDBOX_API_KEY:-}"
      N8N_SANDBOX_SERVICE_URL: http://optional-n8n-sandbox-api:8080
      N8N_SANDBOX_SERVICE_API_KEY: "${N8N_SANDBOX_API_KEY:-}"
      N8N_INSTANCE_AI_SANDBOX_IMAGE: optional-n8n-sandbox-registry:5000/n8n-sandbox:local
      N8N_INSTANCE_AI_SEARXNG_URL: http://optional-n8n-searxng:8080
      HTTP_PROXY: http://egress-proxy:3128
      HTTPS_PROXY: http://egress-proxy:3128
      NO_PROXY: ollama-gate,optional-n8n-sandbox-api,optional-n8n-searxng,optional-forgejo,unbound,egress-proxy,localhost,127.0.0.1
    volumes:
      - ${AGENTIC_ROOT:-/srv/agentic}/optional/n8n/data:/home/node/.n8n
      - ${AGENTIC_ROOT:-/srv/agentic}/optional/n8n/custom:/home/node/.n8n/custom
      - ${AGENTIC_ROOT:-/srv/agentic}/optional/n8n/logs:/home/node/.n8n/logs
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O- http://127.0.0.1:5678/healthz >/dev/null
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 20s
    networks:
      - agentic
      - n8n-sandbox

  optional-n8n-loopback:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    profiles:
      - optional-n8n
      - optional-n8n-ai
    depends_on:
      optional-n8n:
        condition: service_healthy
    restart: unless-stopped
    cpus: ${AGENTIC_LIMIT_OPTIONAL_N8N_LOOPBACK_CPUS:-${AGENTIC_LIMIT_OPTIONAL_CPUS:-${AGENTIC_LIMIT_DEFAULT_CPUS:-1.00}}}
    mem_limit: ${AGENTIC_LIMIT_OPTIONAL_N8N_LOOPBACK_MEM:-${AGENTIC_LIMIT_OPTIONAL_MEM:-${AGENTIC_LIMIT_DEFAULT_MEM:-1g}}}
    user: "${AGENT_RUNTIME_UID:-1000}:${AGENT_RUNTIME_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command:
      - /bin/sh
      - -ec
      - |
        mkdir -p /tmp/client_temp /tmp/proxy_temp /tmp/fastcgi_temp /tmp/uwsgi_temp /tmp/scgi_temp
        cat >/tmp/nginx.conf <<'NGINX'
        pid /tmp/nginx.pid;
        events {}
        http {
          resolver 127.0.0.11 valid=30s ipv6=off;
          client_body_temp_path /tmp/client_temp;
          proxy_temp_path /tmp/proxy_temp;
          fastcgi_temp_path /tmp/fastcgi_temp;
          uwsgi_temp_path /tmp/uwsgi_temp;
          scgi_temp_path /tmp/scgi_temp;
          server {
            listen 5678;
            location / {
              set $$n8n_upstream optional-n8n;
              proxy_pass http://$$n8n_upstream:5678;
              proxy_http_version 1.1;
              proxy_set_header Host $$http_host;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Host $$http_host;
              proxy_set_header X-Forwarded-Proto $$scheme;
              proxy_buffering off;
              proxy_read_timeout 3600s;
              proxy_send_timeout 3600s;
            }
          }
        }
        NGINX
        exec nginx -g 'daemon off;' -c /tmp/nginx.conf
    ports:
      - 127.0.0.1:${N8N_HOST_PORT:-5678}:5678
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O- http://127.0.0.1:5678/healthz >/dev/null
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 15s
    networks:
      - agentic
      - agentic-egress

networks:
  agentic:
    external: true
    name: ${AGENTIC_NETWORK:?AGENTIC_NETWORK must be set (use ./agent or source scripts/lib/runtime.sh)}
  agentic-egress:
    external: true
    name: ${AGENTIC_EGRESS_NETWORK:?AGENTIC_EGRESS_NETWORK must be set (use ./agent or source scripts/lib/runtime.sh)}
  n8n-sandbox:
    driver: bridge
    internal: true
    name: ${AGENTIC_COMPOSE_PROJECT:-agentic}-n8n-sandbox

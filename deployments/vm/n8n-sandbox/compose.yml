services:
  tls-init:
    image: ${N8N_SANDBOX_API_IMAGE:-n8nio/n8n-sandbox-service-api:latest}
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        bootstrap-mtls.sh --out-dir /tls
        --api-san n8n-sandbox-api-local
        --control-san-prefix n8n-sandbox-runner-local
        && chown -R sandbox-api:sandbox-api /tls/api
    environment:
      NUM_RUNNERS: "1"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    volumes:
      - /srv/n8n-sandbox/tls:/tls
    networks:
      - control

  registry:
    image: registry:2.8.3
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - /srv/n8n-sandbox/registry:/var/lib/registry
    healthcheck:
      test: ["CMD", "/bin/registry", "--version"]
      interval: 15s
      timeout: 5s
      retries: 6
    networks:
      - control

  image-seed:
    image: quay.io/skopeo/stable:latest
    depends_on:
      registry:
        condition: service_started
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        attempts=0
        until skopeo copy --dest-tls-verify=false \
          "docker://${N8N_SANDBOX_IMAGE:-n8nio/n8n-sandbox-service-sandbox:latest}" \
          docker://registry:5000/n8n-sandbox:upstream; do
          attempts=$$((attempts + 1))
          [ "$$attempts" -lt 5 ] || exit 1
          sleep 3
        done
    environment:
      HTTP_PROXY: ${SANDBOX_EGRESS_PROXY_URL:?SANDBOX_EGRESS_PROXY_URL is required}
      HTTPS_PROXY: ${SANDBOX_EGRESS_PROXY_URL:?SANDBOX_EGRESS_PROXY_URL is required}
      http_proxy: ${SANDBOX_EGRESS_PROXY_URL:?SANDBOX_EGRESS_PROXY_URL is required}
      https_proxy: ${SANDBOX_EGRESS_PROXY_URL:?SANDBOX_EGRESS_PROXY_URL is required}
      NO_PROXY: registry,localhost,127.0.0.1
      no_proxy: registry,localhost,127.0.0.1
    networks:
      - control
      - seed-egress

  image-customize:
    image: quay.io/skopeo/stable:latest
    depends_on:
      image-seed:
        condition: service_completed_successfully
    restart: "no"
    read_only: true
    tmpfs:
      - /work
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      SANDBOX_EGRESS_PROXY_URL: ${SANDBOX_EGRESS_PROXY_URL:?SANDBOX_EGRESS_PROXY_URL is required}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        skopeo copy --src-tls-verify=false \
          docker://registry:5000/n8n-sandbox:upstream dir:/work/image
        old_digest="$$(sed -n 's/.*"digest": "sha256:\([0-9a-f]*\)".*/\1/p' /work/image/manifest.json | head -n 1)"
        [ -n "$$old_digest" ]
        old_config="/work/image/$$old_digest"
        old_size="$$(wc -c <"$$old_config" | tr -d ' ')"
        mkdir -p \
          /work/layer/etc/apt/apt.conf.d \
          /work/layer/etc \
          /work/layer/home/user/.config/pip \
          /work/layer/home/user
        printf 'Acquire::http::Proxy "%s";\nAcquire::https::Proxy "%s";\n' \
          "$${SANDBOX_EGRESS_PROXY_URL}" "$${SANDBOX_EGRESS_PROXY_URL}" \
          >/work/layer/etc/apt/apt.conf.d/99agentic-proxy
        printf 'proxy=%s\nhttps-proxy=%s\n' \
          "$${SANDBOX_EGRESS_PROXY_URL}" "$${SANDBOX_EGRESS_PROXY_URL}" \
          >/work/layer/home/user/.npmrc
        printf '[global]\nproxy = %s\n' "$${SANDBOX_EGRESS_PROXY_URL}" \
          >/work/layer/home/user/.config/pip/pip.conf
        printf '[http]\n\tproxy = %s\n' "$${SANDBOX_EGRESS_PROXY_URL}" \
          >/work/layer/home/user/.gitconfig
        printf 'proxy = "%s"\n' "$${SANDBOX_EGRESS_PROXY_URL}" \
          >/work/layer/home/user/.curlrc
        printf 'use_proxy = on\nhttp_proxy = %s\nhttps_proxy = %s\n' \
          "$${SANDBOX_EGRESS_PROXY_URL}" "$${SANDBOX_EGRESS_PROXY_URL}" \
          >/work/layer/etc/wgetrc
        tar -C /work/layer --numeric-owner --owner=0 --group=0 -cf /work/proxy-config.tar .
        layer_diff="$$(sha256sum /work/proxy-config.tar | awk '{print $$1}')"
        gzip -n /work/proxy-config.tar
        layer_digest="$$(sha256sum /work/proxy-config.tar.gz | awk '{print $$1}')"
        layer_size="$$(wc -c </work/proxy-config.tar.gz | tr -d ' ')"
        mv /work/proxy-config.tar.gz "/work/image/$$layer_digest"
        sed -i \
          "s#\"Env\":\[#\"Env\":[\"HTTP_PROXY=$${SANDBOX_EGRESS_PROXY_URL}\",\"HTTPS_PROXY=$${SANDBOX_EGRESS_PROXY_URL}\",\"http_proxy=$${SANDBOX_EGRESS_PROXY_URL}\",\"https_proxy=$${SANDBOX_EGRESS_PROXY_URL}\",\"NO_PROXY=localhost,127.0.0.1\",\"no_proxy=localhost,127.0.0.1\",#" \
          "$$old_config"
        sed -i \
          "s#\(\"diff_ids\":\[[^]]*\)\]#\1,\"sha256:$$layer_diff\"]#" \
          "$$old_config"
        new_digest="$$(sha256sum "$$old_config" | awk '{print $$1}')"
        new_size="$$(wc -c <"$$old_config" | tr -d ' ')"
        mv "$$old_config" "/work/image/$$new_digest"
        sed -i "s/$$old_digest/$$new_digest/" /work/image/manifest.json
        sed -i "0,/\"size\": $$old_size/s//\"size\": $$new_size/" /work/image/manifest.json
        sed -i '$$d' /work/image/manifest.json
        sed -i '$$d' /work/image/manifest.json
        sed -i '$$s/}/},/' /work/image/manifest.json
        printf '    {\n      "mediaType": "application/vnd.oci.image.layer.v1.tar+gzip",\n      "digest": "sha256:%s",\n      "size": %s\n    }\n  ]\n}\n' \
          "$$layer_digest" "$$layer_size" >>/work/image/manifest.json
        skopeo copy --dest-tls-verify=false dir:/work/image \
          docker://registry:5000/n8n-sandbox:proxied
    networks:
      - control

  api:
    image: ${N8N_SANDBOX_API_IMAGE:-n8nio/n8n-sandbox-service-api:latest}
    restart: unless-stopped
    depends_on:
      tls-init:
        condition: service_completed_successfully
    env_file:
      - ${SANDBOX_VM_ENV_FILE:-/etc/n8n-sandbox/sandbox.env}
    environment:
      SANDBOX_API_GRPC_TLS_CERT_FILE: /tls/grpc-server.crt
      SANDBOX_API_GRPC_TLS_KEY_FILE: /tls/grpc-server.key
      SANDBOX_API_GRPC_TLS_CLIENT_CA_FILE: /tls/ca.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CA_FILE: /tls/ca.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CERT_FILE: /tls/control-grpc-api-client.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_KEY_FILE: /tls/control-grpc-api-client.key
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_SERVER_NAME: n8n-sandbox-runner-local-1
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - ${SANDBOX_VM_BIND_IP:?SANDBOX_VM_BIND_IP is required}:8080:8080
    volumes:
      - /srv/n8n-sandbox/tls/api:/tls:ro
      - /srv/n8n-sandbox/api-data:/var/lib/n8n-sandbox-api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks:
      control:
        aliases:
          - n8n-sandbox-api
      ingress: {}

  runner:
    image: ${N8N_SANDBOX_RUNNER_IMAGE:-n8nio/n8n-sandbox-service-runner-dind:latest}
    runtime: sysbox-runc
    # The manager reapplies the fail-closed host and inner-Docker policies
    # before starting this service. Never race those policies on a raw VM boot.
    restart: "no"
    depends_on:
      tls-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      image-seed:
        condition: service_completed_successfully
      image-customize:
        condition: service_completed_successfully
    env_file:
      - ${SANDBOX_VM_ENV_FILE:-/etc/n8n-sandbox/sandbox.env}
    environment:
      SANDBOX_RUNNER_DOCKER_SANDBOX_IMAGE: registry:5000/n8n-sandbox:proxied
      SANDBOX_RUNNER_DOCKER_INSECURE_REGISTRIES: registry:5000
      SANDBOX_RUNNER_API_GRPC_ADDR: n8n-sandbox-api:9090
      # Published ARM64 latest still serves this private HTTP channel without TLS.
      # Registration and control gRPC remain mTLS; see ADR-0151.
      SANDBOX_RUNNER_HTTP_BASE_URL: http://n8n-sandbox-runner-1:8080
      SANDBOX_RUNNER_CONTROL_GRPC_LISTEN_ADDR: ":9091"
      SANDBOX_RUNNER_CONTROL_GRPC_ADVERTISE_ADDR: n8n-sandbox-runner-1:9091
      SANDBOX_RUNNER_REGISTRATION_GRPC_CA_FILE: /tls/ca.crt
      SANDBOX_RUNNER_REGISTRATION_GRPC_CERT_FILE: /tls/grpc-client.crt
      SANDBOX_RUNNER_REGISTRATION_GRPC_KEY_FILE: /tls/grpc-client.key
      SANDBOX_RUNNER_REGISTRATION_GRPC_SERVER_NAME: n8n-sandbox-api-local
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_CERT_FILE: /tls/control-grpc-server.crt
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_KEY_FILE: /tls/control-grpc-server.key
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_CLIENT_CA_FILE: /tls/ca.crt
    volumes:
      - /srv/n8n-sandbox/tls/runner:/tls:ro
      - /srv/n8n-sandbox/runner-data:/var/sandboxes
      - /srv/n8n-sandbox/docker-data:/var/lib/docker
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    networks:
      control:
        aliases:
          - n8n-sandbox-runner-1
      sandbox-egress: {}

networks:
  control:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.10.0/24
  seed-egress:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.11.0/24
  ingress:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.12.0/24
  sandbox-egress:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.13.0/24

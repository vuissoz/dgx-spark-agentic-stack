name: Trigger PLAN refonte v2

on:
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-plan:
    if: github.head_ref == 'plan/refonte-v2-collab'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: plan/refonte-v2-collab
          fetch-depth: 0
      - name: Execute insertion block and clean temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('.github/workflows/apply-plan-refonte-v2.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if line == '        run: |') + 1
          body = []
          for line in lines[start:]:
              if line and len(line) - len(line.lstrip()) <= 8:
                  break
              body.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/apply-plan.sh').write_text('\n'.join(body) + '\n', encoding='utf-8')
          PY
          bash /tmp/apply-plan.sh
          rm -f .github/workflows/apply-plan-refonte-v2.yml .github/workflows/trigger-plan-refonte-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(plan): add v2 and collaboration roadmap'
          git push origin HEAD:plan/refonte-v2-collab

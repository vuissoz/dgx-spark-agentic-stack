          insert_before(
              "## 15. Registre des risques et décisions bloquantes\n",
              '''### 14.6 Suite de benchmarks DGX Spark

          La v2 conserve et étend `agent ollama bench` et `repo-e2e`. Les résultats sont associés au firmware, au noyau, au driver NVIDIA, aux digests d’images, aux versions OpenShell/NemoClaw, aux modèles et au commit du plan.

          **Niveau 0 — baseline matérielle :**

          - topologie CPU/GPU, 128 Go de mémoire unifiée attendue, bande passante, stockage et réseau ;
          - températures, puissance, fréquences, throttling et erreurs système ;
          - débit disque et espace réellement disponible.

          **Niveau 1 — backends modèles :**

          - temps de chargement/déchargement et mémoire résidente ;
          - TTFT, prefill et decode tokens/s, streaming et précision des usages ;
          - contextes 8k, 32k, 64k et plus seulement lorsqu’ils sont supportés ;
          - outils, sorties structurées et protocoles Chat/Responses/Messages ;
          - concurrence 1, 2, 4 puis 8 selon admission ;
          - Ollama, TensorRT-LLM et autres backends retenus.

          **Niveau 2 — harnesses :**

          - démarrage chaud/froid, reprise et compaction ;
          - `repo-e2e`, opérations Git et GitHub, outils et approvals ;
          - sous-agents, profondeur, concurrence, annulation et agrégation des coûts ;
          - comparaison entre profils modèles réellement supportés par chaque harness.

          **Niveau 3 — applications et données :**

          - latence et concurrence OpenWebUI ;
          - workflow Flux représentatif dans ComfyUI, mémoire maximale et libération ;
          - tâche OpenHands complète ;
          - indexation et recherche RAG ;
          - clone/push Forgejo et accès GitHub ;
          - téléchargement HF avec cache froid puis chaud.

          **Niveau 4 — mixte, endurance et panne :**

          - charges interactives et tâches de fond combinées pendant 1 h, 6 h puis 24 h ;
          - redémarrage d’un backend, perte réseau, téléchargement interrompu, pression disque et échec de chargement modèle ;
          - absence d’OOM, reboot, corruption, fuite de secrets ou blocage durable ;
          - restauration d’un service et reprise des tâches supportées.

          Les campagnes montent en charge progressivement et possèdent des coupe-circuits sur température, mémoire disponible, erreurs GPU, swap, espace disque et latence du plan de contrôle. Les seuils d’admission ne sont pas inventés : ils sont dérivés des mesures avec une réserve explicite pour l’OS et les services critiques. Un cooldown est imposé entre charges lourdes.

          La CI ordinaire utilise des smoke tests bornés. Les benchmarks lourds s’exécutent sur la DGX dans une fenêtre dédiée et ne téléchargent ou ne chargent jamais plusieurs gros modèles sans admission préalable. Une release est bloquée si elle dépasse les budgets de régression définis à partir de la baseline validée.

          ### 14.7 Tests d’intégration par composant

          Pour chaque harness et application V1, le registre contient au minimum : version amont, architecture ARM64, protocole modèle, fichiers persistants, surfaces, permissions, accès GitHub/HF, scénario nominal, scénario négatif, sauvegarde/restauration et benchmark représentatif.


              '''### 11.4.1 Autorisations documentaires par lot

          Le portail et l’API proposent un objet `AuthorizationBatch` pour autoriser plusieurs documents en une seule opération.

          Un lot contient :

          - les critères de sélection : fichiers, répertoire, collection, projet, type, étiquette ou requête ;
          - l’action : lire, indexer, rechercher, partager, publier ou supprimer ;
          - les bénéficiaires : utilisateurs, groupes, identités d’agents ou classes d’agents ;
          - la portée : projet, organisation ou globale ;
          - une expiration, une date de revue ou un nombre maximal d’utilisations ;
          - des exclusions immuables pour secrets, données réglementées ou refus explicites.

          Avant validation, un dry-run affiche le nombre de documents, leur volume, leurs classifications, les projets touchés et les exclusions. L’option « autoriser globalement tous les documents correspondants » existe, mais elle est réservée à l’administrateur, explicite, révocable et auditée. Aucun wildcard caché ne contourne les ACL.

          Le lot produit des grants individuels ou une règle serveur versionnée. Le service RAG et les montages fichiers appliquent cette règle côté serveur ; une simple filtration dans le portail n’est jamais suffisante.

          ''')

          replace_once(

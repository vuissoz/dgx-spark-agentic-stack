name: Patch PLAN integration audit

on:
  push:
    branches:
      - plan/refonte-v2-collab
    paths:
      - .github/workflows/patch-plan-integrations.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: plan/refonte-v2-collab
          fetch-depth: 0

      - name: Patch PLAN.md
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("PLAN.md")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one occurrence, got {count}: {old[:120]!r}")
              text = text.replace(old, new, 1)

          def insert_before(marker: str, addition: str) -> None:
              global text
              count = text.count(marker)
              if count != 1:
                  raise SystemExit(f"expected one marker, got {count}: {marker!r}")
              text = text.replace(marker, addition + marker, 1)

          def replace_section(start_marker: str, end_marker: str, replacement: str) -> None:
              global text
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              text = text[:start] + replacement + text[end:]

          replace_section(
              "### 2.2 Agents et applications\n",
              "### 2.3 Modèles et données\n",
              '''### 2.2 Objets V1 à distinguer

          Le registre ne mélange pas tous les composants sous le mot « agent ».

          **Harnesses et runtimes agentiques :**

          - Claude Code, Codex, OpenCode, KiloCode, VibeStral, Hermes, Pi et Goose ;
          - OpenClaw, qui est un gateway multi-agent permanent avec canaux et sessions ;
          - OpenHands, objet hybride combinant application utilisateur, plateforme d’agent et runtime de code.

          **Applications destinées principalement aux humains :**

          - OpenWebUI ;
          - ComfyUI et Flux ;
          - Forgejo ;
          - Grafana et les interfaces d’observabilité ;
          - DGX Dashboard NVIDIA ;
          - JupyterLab ;
          - Portainer lorsqu’il est explicitement activé en mode administrateur de rupture.

          **Services gérés sans identité utilisateur propre :**

          - ModelBroker/`ollama-gate`, Ollama et TensorRT-LLM ;
          - service RAG v1, Qdrant et OpenSearch ;
          - PostgreSQL, reverse proxy, DNS/egress et collecteurs d’observabilité.

          Chaque catégorie possède son propre contrat. Une application humaine n’est pas transformée artificiellement en `AgentRuntime`, et un harness multi-agent n’est pas réduit à un simple processus CLI.

          ''')

          insert_before(
              "## 3. Architecture générale\n",
              '''### 2.6 Catalogue historique de skills, rôles et workflows

          Le Bead historique `dgx-spark-agentic-stack-dy95` mentionne : `Capability Evolver`, `Capability Evolver++`, `Clawflows`, `GOG`, `GitHub`, `Summarize`, `Knowledge Base`, `Mission Control`, `Code Reviewer`, `Decision Assistant`, `Red Team`, `Pre-Mortem`, `Literature Scout`, `Paper Reviewer`, `Grant Writer`, `Citation Auditor`, `Architecture Reviewer`, `Documentation Builder`, `Dependency Auditor`, `Test Engineer`, `Knowledge Curator`, `Knowledge Gap Detector`, `Workspace Cartographer`, `Agent Security Watcher` et `Meeting Synthesizer`.

          **DÉCISION :** ces éléments sont enregistrés initialement comme `SkillPackage`, `AgentProfile`, `WorkflowTemplate` ou connecteur, et non comme nouveaux harnesses indépendants. Un élément ne reçoit un runtime propre que si son implémentation amont, son état, son protocole et son cycle de vie le justifient.

          Le registre de migration distingue donc :

          - le harness qui exécute ;
          - l’identité ou le profil spécialisé ;
          - les skills et outils chargés ;
          - les workflows multi-étapes ;
          - les applications externes appelées.

          `Clawdbot` ou les anciens noms rencontrés dans l’historique sont traités comme des alias historiques d’OpenClaw lorsqu’ils désignent la même lignée, pas comme un runtime supplémentaire.

          ''')

          replace_once("### 3.2 Zones de confiance\n", "### 3.3 Zones de confiance\n")
          replace_once("### 3.3 Déploiement\n", "### 3.4 Déploiement\n")
          insert_before(
              "### 3.3 Zones de confiance\n",
              '''### 3.2 Typologie des adapters

          Le monolithe modulaire utilise des contrats distincts :

          - `HarnessAdapter` : protocole modèle, sessions, sous-agents, outils, permissions et surfaces d’un harness ;
          - `AgentRuntimeAdapter` : création et observation de l’enveloppe d’exécution OpenShell ;
          - `ApplicationAdapter` : lancement, santé, URL, droits, sauvegarde et mise à jour d’une application humaine ;
          - `ManagedServiceAdapter` : état désiré et santé d’un service interne ;
          - `ModelBrokerAdapter` : protocoles et backends modèles ;
          - `RAGServiceAdapter` : recherche et indexation du service RAG existant ;
          - `ExternalAccessBroker` : accès temporaires à GitHub, Hugging Face et futurs services externes.

          Un composant hybride peut utiliser plusieurs adapters. OpenHands utilise par exemple `ApplicationAdapter` pour son interface et `HarnessAdapter` pour son moteur agentique. Les adapters ne recopient pas la logique interne des produits ; ils adaptent leurs contrats et exposent leurs capacités réellement disponibles.

          ''')

          replace_once(
              "| conversation et session native | stockage de l’agent concerné | index de recherche facultatif |",
              "| conversation et session native | stockage du harness concerné | références et état observé dans PostgreSQL |\n| arbre parent/enfants d’une exécution multi-agent | harness natif | projection corrélée pour quotas, audit et annulation |",
          )
          replace_once(
              "| secrets | SecretStore canonique | providers OpenShell ou fichiers temporaires de service |",
              "| secrets | SecretStore canonique | providers OpenShell ou fichiers temporaires de service |\n| autorisations GitHub/Hugging Face | ExternalAccessBroker + politiques PostgreSQL | jetons courts injectés, jamais stockés dans le HOME agent |\n| dépôts GitHub et ressources Hugging Face | service externe concerné | références, empreintes et cache local géré |",
          )

          insert_before(
              "## 6. Broker de modèles et inférence\n",
              '''### 5.5 Arbres d’exécution multi-agent

          Hermes, OpenClaw, OpenHands, Goose, KiloCode, OpenCode, Claude Code et certaines extensions Pi peuvent déléguer du travail à des sous-agents. La plateforme ne remplace pas cette orchestration native lorsqu’elle est disponible.

          Chaque `HarnessAdapter` déclare :

          - `orchestration_mode` : `none`, `native`, `platform` ou `external-provider` ;
          - profondeur maximale ;
          - nombre maximal d’enfants simultanés et total ;
          - mécanismes natifs d’annulation, reprise et inspection ;
          - politique d’héritage des outils, modèles, secrets et droits ;
          - capacité à remonter les métriques d’un enfant.

          Invariants :

          - les permissions d’un enfant sont incluses dans celles du parent et du projet ;
          - CPU, mémoire, GPU, tokens, coûts et accès externes sont comptés sur l’arbre complet ;
          - l’annulation du parent se propage lorsque le harness le permet, sinon les enfants orphelins sont détectés et drainés ;
          - chaque événement porte `run_id`, `parent_run_id`, `harness`, `agent_identity` et `project_id` ;
          - une délégation vers un autre harness est interdite par défaut et exige une règle explicite ;
          - les cycles de délégation et les rebonds Hermes → Goose → Codex → Hermes sont détectés et refusés ;
          - la plateforme ne promet pas une sandbox OpenShell distincte pour chaque enfant si le harness utilise des sous-agents en processus ou sessions internes ; elle impose alors une enveloppe agrégée et une politique compatible.

          ''')

          insert_before(
              "## 7. OpenShell et NemoClaw\n",
              '''### 6.6 Matrice de compatibilité des protocoles modèles

          **DÉCISION :** le ModelBroker ne force pas tous les clients à utiliser le même protocole. Les profils Ollama officiels et les documentations amont servent de référence de compatibilité, puis la stack ajoute identité, quotas et audit.

          | Composant | Protocole à préserver | Points de validation |
          |---|---|---|
          | Claude Code | Anthropic Messages `/v1/messages` | outils, `tool_choice`, streaming, usage, hooks et sous-agents |
          | Codex | OpenAI Responses `/v1/responses` | événements streaming, outils, approbations et modèle configuré |
          | OpenCode | OpenAI Chat Completions ou Responses selon le package provider | `opencode.json`, agents natifs, permissions et serveur headless |
          | KiloCode | Ollama natif ou OpenAI-compatible selon configuration | outils, contexte utile, timeouts, modes et sous-agents |
          | VibeStral | endpoint compatible configuré par Vibe | modèles locaux, agents TOML, trust du projet et ACP |
          | Pi | OpenAI Chat, Responses, Anthropic Messages ou provider d’extension | drapeaux de compatibilité, extensions et stockage d’auth séparé |
          | Goose | provider configuré par extension/recipe | outils, recipes, ACP et sous-agents externes |
          | Hermes | `chat_completions`, `codex_responses` ou `anthropic_messages` par profil | profils, délégation, outils, dashboard et usage |
          | OpenClaw | fournisseur Ollama/OpenAI-compatible configuré par agent | sessions, canaux, outils et sous-agents |
          | OpenHands | backend LiteLLM/OpenAI-compatible retenu | streaming, outils, coût et orchestration SDK |
          | OpenWebUI | API OpenAI exposée par ModelBroker | liste des modèles, streaming, outils autorisés et RBAC |

          Chaque profil d’intégration comprend un test de négociation de capacités. Une compatibilité superficielle obtenue avec un simple `Hello` ne suffit pas : les tests couvrent les outils, les erreurs, les tokens d’usage, la longueur de contexte, le streaming et les fonctions multi-agent réellement utilisées.

          `ollama launch` est utilisé comme oracle de configuration pour Claude Code, Codex, OpenCode, Pi et OpenClaw lorsque disponible, mais la v2 génère ses propres fichiers versionnés et ne dépend pas d’un lancement interactif Ollama en production.

          ''')

          replace_section(
              "### 7.4 NemoClaw\n",
              "## 8. Applications, portail et surfaces\n",
              '''### 7.4 OpenClaw et NemoClaw

          **CIBLE :** NemoClaw est le chemin privilégié pour OpenClaw si la parité avec la v1 est démontrée. Le test couvre le gateway permanent, les identités d’agents, les workspaces, les sessions, la mémoire, les skills, les canaux, les approvals, le relay, les pièces jointes, le Control UI et les sous-agents.

          OpenClaw reste un gateway multi-agent de longue durée. Son état natif n’est pas aplati en sessions génériques du plan de contrôle. Les bindings de canaux, les `agentDir`, les historiques et les arbres de sessions restent possédés par OpenClaw puis projetés pour l’audit et les quotas.

          ### 7.5 Deux chemins Hermes explicitement supportés

          **Hermes natif — chemin de référence :**

          - `HermesNativeAdapter` exécute Hermes dans une enveloppe OpenShell validée ;
          - préserve les profils indépendants, configurations, clés référencées, mémoires, sessions, skills, cron, messageries et bases d’état ;
          - préserve le Web Dashboard, le Chat navigateur et Hermes Desktop ;
          - préserve la délégation native vers des sous-agents isolés et le Kanban durable partagé entre profils ;
          - applique des limites configurables de concurrence, profondeur et budget aux délégations ;
          - utilise le mode de protocole ModelBroker correspondant à chaque profil.

          **Hermes via NemoClaw — chemin canari :**

          - `HermesNemoClawAdapter` utilise le blueprint NemoClaw épinglé ;
          - reste désactivé par défaut tant que les limitations amont et la parité ne sont pas levées ;
          - dispose de sa propre racine d’état ;
          - ne partage jamais `HERMES_HOME`, les sessions ou la base mutable avec Hermes natif ;
          - reçoit des importeurs/exporteurs en dry-run et des tests comparatifs.

          La promotion de NemoClaw pour Hermes exige la parité sur CLI, dashboard, profils, mémoire, sessions, outils, délégation, Kanban, cron, messageries, Desktop, reprise et consommation de ressources. En cas d’écart, Hermes natif reste le chemin de production ; aucun contournement d’OpenShell ni perte fonctionnelle n’est accepté.

          ### 7.6 OpenHands et la double sandbox

          OpenHands combine interface utilisateur, orchestration d’agents et runtime de code. La v2 ne superpose pas aveuglément une sandbox OpenShell à chaque sandbox OpenHands.

          M2 compare trois options :

          1. interface et contrôle OpenHands hors sandbox, agent-server/runtime fourni par un driver OpenShell ;
          2. runtime OpenHands natif conservé derrière une enveloppe OpenShell externe minimale ;
          3. intégration directe de l’Agent SDK OpenHands au plan de contrôle.

          Le choix doit préserver délégation de sous-agents, terminal, navigateur, fichiers, GitHub, reprise, WebSocket et sécurité. L’édition locale OpenHands étant conçue pour un utilisateur, une instance partagée n’est pas supposée multi-tenant : la v2 choisit une instance par utilisateur/domaine de sécurité ou une édition officiellement multi-tenant.

          ## 8. Applications, portail et surfaces
''')

          insert_before(
              "## 9. Secrets\n",
              '''### 8.4 Profils d’intégration par harness V1

          Chaque profil est versionné avec version amont, image/digest, protocole modèle, fichiers persistants, surfaces, capacités natives et tests.

          | Harness | État et extensions à préserver | Particularités d’intégration |
          |---|---|---|
          | Claude Code | `CLAUDE.md`, `.claude/agents`, hooks, skills/plugins, MCP, historique utile | sous-agents avec outils/permissions propres ; hooks de permission et événements de sous-agents ; protocole Anthropic Messages |
          | Codex | `config.toml`, providers, sessions, approvals, règles de sandbox | Responses API ; CLI principal, surfaces app/IDE facultatives ; ne pas dupliquer les approvals dans deux couches incohérentes |
          | OpenCode | `opencode.json`, auth séparée, agents/subagents, permissions, sessions | choix explicite Chat ou Responses ; serveur headless/OpenAPI possible ; mot de passe serveur requis s’il est exposé |
          | KiloCode | `.kilo/agents`, modes, permissions, sessions et configuration provider | CLI, IDE et console web ; sous-agents natifs ; contexte et timeouts des modèles locaux benchmarkés |
          | VibeStral | `VIBE_HOME`, `config.toml`, agents TOML, `AGENTS.md`, skills, sessions | CLI/VS Code/ACP ; trust des répertoires ; fonctionnement local/hors ligne ; cloud et teleport désactivés par défaut |
          | Pi | modèles, extensions/packages, sessions et configuration | harness volontairement minimal ; aucun sous-agent natif supposé sans package épinglé ; `auth.json` hors workspace |
          | Goose | recipes, extensions, sessions, ACP et paramètres de sous-agents | peut orchestrer des agents externes comme Claude/Codex ; règles anti-récursion et budgets obligatoires |
          | Hermes | profils, dashboard, mémoire, sessions, skills, cron, messageries, Kanban | chemin natif et chemin NemoClaw séparés ; multi-agent natif et concurrence agrégée |
          | OpenClaw | gateway, agents, `agentDir`, sessions, bindings de canaux, mémoire, skills, relay et UI | multi-agent et multi-canal natif ; processus de longue durée ; NemoClaw seulement après parité |
          | OpenHands | UI, settings, conversations, skills/hooks, GitHub et runtime | application + harness multi-agent ; choix explicite de stratégie sandbox et séparation utilisateurs |

          Les tests de chaque harness vérifient le binaire officiel réellement exécuté, et non la seule présence d’un wrapper. Ils valident également les fichiers générés selon la version amont courante afin d’éviter le type de faux positif déjà rencontré avec Vibe.

          ### 8.5 Profils d’intégration des applications humaines V1

          | Application | Contrat v2 | Points particuliers |
          |---|---|---|
          | OpenWebUI | `ApplicationAdapter`, authentification, RBAC, modèles via ModelBroker, sauvegarde | ses Tools/Functions/Pipelines exécutent du code et sont désactivés ou allowlistés ; son RAG natif ne devient pas une seconde source de vérité sans décision explicite |
          | ComfyUI | `ApplicationAdapter` + `GPUJobAdapter` | workflows API, WebSocket, Flux, racine persistante unique ; custom nodes épinglés, examinés et allowlistés |
          | Forgejo | `ApplicationAdapter` + `GitProviderAdapter` | forge interne canonique, comptes humains/agents, SSH, hooks, branches protégées et sauvegarde officielle |
          | Grafana | `ApplicationAdapter` en lecture majoritaire | dashboards, datasource et alertes versionnés ; aucun pouvoir de contrôle implicite |
          | DGX Dashboard | launcher administrateur supporté | mise à jour et diagnostic système ; pas d’iframe ou proxy supposé compatible sans test |
          | JupyterLab | application interactive exécutant du code | instance et répertoires isolés par utilisateur ; quotas et accès externes explicites |
          | Portainer | outil break-glass désactivé par défaut | administrateur uniquement ; ne contourne pas le plan de contrôle dans les parcours normaux |

          ### 8.6 Séparation des parcours portail

          Le portail possède des entrées différentes :

          - **Agents** : identités, sessions, projets, sous-agents, approvals et budgets ;
          - **Applications** : OpenWebUI, ComfyUI, OpenHands, Forgejo, Grafana et JupyterLab ;
          - **Services** : santé et configuration contrôlée du RAG, des modèles et de l’observabilité ;
          - **Système** : DGX Dashboard, sauvegardes, mises à jour et opérations de rupture.

          Une application peut invoquer un agent ou un modèle, mais elle ne devient pas pour autant une identité d’agent dans l’annuaire.

          ''')

          replace_once("## 9. Secrets\n", "## 9. Secrets et accès externes\n\n### 9.1 SecretStore canonique\n")
          insert_before(
              "## 10. Scheduler et ressources\n",
              '''### 9.2 ExternalAccessBroker : GitHub et Hugging Face

          **DÉCISION :** les agents peuvent accéder à GitHub et Hugging Face selon des capacités explicites. Forgejo reste la forge interne canonique ; GitHub est une destination externe, un miroir ou une source selon le projet.

          Capacités minimales déclarables dans les manifestes :

          - `github.contents.read`, `github.contents.write` ;
          - `github.pull_requests.read`, `github.pull_requests.write` ;
          - `github.issues.read`, `github.issues.write` ;
          - `github.actions.read` et capacités administratives séparées ;
          - `hf.models.read`, `hf.models.write` ;
          - `hf.datasets.read`, `hf.datasets.write` ;
          - `hf.spaces.read`, `hf.spaces.write`.

          GitHub :

          - préférer une GitHub App avec jetons d’installation courts, permissions minimales et dépôts sélectionnés ;
          - utiliser un PAT finement granulaire par utilisateur seulement lorsque la GitHub App ne couvre pas le cas ;
          - distinguer clone/fetch, push, création de branche, pull request, issue, release et workflows ;
          - exiger une approbation ou une politique explicite pour les écritures externes et le déclenchement de workflows.

          Hugging Face :

          - utiliser des tokens fins limités aux modèles, datasets ou organisations nécessaires ;
          - séparer lecture et publication ;
          - centraliser `snapshot_download`, le cache et le catalogue afin d’éviter que chaque agent télécharge les mêmes dizaines de gigaoctets ;
          - enregistrer révision, digest, licence et provenance avant exposition aux runtimes ;
          - soumettre publication, suppression et modification de model card à une autorisation explicite.

          Les jetons ne sont jamais persistés dans le HOME de l’agent. L’ExternalAccessBroker émet ou livre un credential court, associé à utilisateur, agent, projet, run et capacités. Les outils natifs (`git`, `gh`, `huggingface_hub`, CLI HF, MCP GitHub) consomment ce credential par mécanisme temporaire. Toutes les opérations sont corrélées et auditées.

          Les politiques OpenShell n’autorisent que les domaines, méthodes et chemins nécessaires. Un accès réseau à `github.com` ou `huggingface.co` sans capability correspondante reste refusé.

          ''')

          replace_once(
